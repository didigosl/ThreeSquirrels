<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐿️</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>三只松鼠财务管理 · 登录</title>
    <style>
      :root { --bg1:#0ea5e9; --bg2:#3b82f6; --card:#ffffff; --text:#0f172a; --muted:#64748b; --blue:#2563eb; --line:#e5e7eb; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Noto Sans SC", "Microsoft Yahei", sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2)); display:flex; align-items:center; justify-content:center; }
      .wrap { width: min(1000px, 92vw); display:grid; grid-template-columns: 1fr 1fr; gap:0; background: var(--card); border-radius: 18px; box-shadow: 0 24px 64px rgba(0,0,0,0.2); border: 1px solid var(--line); overflow:hidden; }
      .left { position:relative; padding:24px 28px; background: linear-gradient(180deg, #eff6ff, #ffffff); }
      .hero { position:absolute; inset:0; padding:24px; display:flex; align-items:center; justify-content:center; }
      .hero .circle { width:160px; height:160px; border-radius:50%; background:#dbeafe; position:absolute; left:50px; top:60px; }
      .hero .circle2 { width:120px; height:120px; border-radius:50%; background:#bfdbfe; position:absolute; right:60px; bottom:80px; }
      .hero .desk { width:70%; height:160px; background:#1e40af; border-radius:16px; opacity:0.1; }
      .right { padding:36px 40px; display:flex; flex-direction:column; }
      .brand { color: var(--blue); font-weight:700; font-size:28px; }
      .sub { color: var(--muted); margin-top:4px; }
      .form { margin-top:24px; display:flex; flex-direction:column; gap:14px; }
      .label { font-size:13px; color: var(--muted); }
      input, select { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; outline:none; font-size:15px; background:#fff; }
      input:focus, select:focus { border-color: var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,0.12); }
      .password-wrap { position: relative; }
      .password-wrap input { padding-right: 52px; }
      .eye-btn { position:absolute; right:12px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:#64748b; cursor:pointer; font-size:18px; line-height:1; padding:4px; user-select:none; }
      .eye-btn:hover { color:#2563eb; }
      .btn { width:100%; padding:12px 14px; border:none; border-radius:10px; background: var(--blue); color:#fff; font-weight:600; cursor:pointer; transition: transform .08s ease, filter .12s ease, opacity .12s ease; }
      .btn:hover { filter: brightness(1.03); }
      .btn:active { transform: scale(0.98); filter: brightness(0.95); }
      .btn:disabled { opacity:.72; cursor:not-allowed; }
      .tip { margin-top:10px; font-size:13px; color: var(--muted); }
      .error { margin-top:8px; padding:8px 10px; border:1px solid #fecaca; background:#fff1f2; color:#ef4444; border-radius:8px; display:none; }
      .footer { margin-top:20px; color:#93c5fd; text-align:center; font-size:12px; }
      @media (max-width: 640px) {
        body { align-items:stretch; padding:12px; }
        .wrap { width:100%; min-height:calc(100vh - 24px); grid-template-columns:1fr; border-radius:14px; }
        .left { display:none; }
        .right { justify-content:center; padding:28px 20px; }
        .brand { font-size:22px; text-align:center; }
        .sub { text-align:center; }
        .form { margin-top:28px; gap:16px; }
        input, select, .btn { min-height:46px; font-size:16px; }
        .footer { margin-top:28px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="left">
        <div class="hero">
          <div class="desk"></div>
          <div class="circle"></div>
          <div class="circle2"></div>
        </div>
      </div>
      <div class="right">
        <div class="brand">🐿️ 三只松鼠财务管理</div>
        <form id="login-form" class="form" autocomplete="off">
          <div>
            <div class="label">登录名称</div>
            <input id="login-name" type="text" placeholder="请输入登录名称" autocomplete="off" autocapitalize="none" spellcheck="false">
          </div>
          <div>
            <div class="label">密码</div>
            <div class="password-wrap">
              <input id="login-pass" type="password" placeholder="请输入密码" autocomplete="new-password">
              <button id="login-eye" class="eye-btn" type="button" aria-label="按住查看密码" title="按住查看密码">👁</button>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px">
            <input id="login-default" type="checkbox" style="width:auto">
            <span class="label">记住密码</span>
          </div>
          <button id="login-submit" class="btn" type="submit">登录</button>
          <div id="login-error" class="error">账号或密码错误</div>
        </form>
        <div class="footer">Copyright © 三只松鼠</div>
      </div>
    </div>
    <script>
      var form = document.getElementById('login-form');
      var nameInput = document.getElementById('login-name');
      var p = document.getElementById('login-pass');
      var eyeBtn = document.getElementById('login-eye');
      var err = document.getElementById('login-error');
      var def = document.getElementById('login-default');
      var submitBtn = document.getElementById('login-submit');
      var API_BASE = '';
      var APP_LOCALE_KEY = 'ts-app-locale';

      function safeParseJSON(text, fallback) {
        try {
          return JSON.parse(text || '');
        } catch (_) {
          return fallback;
        }
      }

      function setAuthUser(user) {
        if (user) localStorage.setItem('authUser', JSON.stringify(user));
        else localStorage.removeItem('authUser');
      }

      function setAppLocale(locale) {
        localStorage.setItem(APP_LOCALE_KEY, locale === 'es-ES' ? 'es-ES' : 'zh-CN');
      }

      function syncDocumentLang() {
        var locale = String(localStorage.getItem(APP_LOCALE_KEY) || 'zh-CN');
        document.documentElement.lang = locale === 'es-ES' ? 'es' : 'zh-CN';
      }

      function showError(message) {
        if (!err) return;
        err.textContent = message || '登录失败';
        err.style.display = 'block';
      }

      function hideError() {
        if (!err) return;
        err.style.display = 'none';
      }

      function setSubmitting(loading) {
        if (!submitBtn) return;
        submitBtn.disabled = !!loading;
        submitBtn.textContent = loading ? '登录中...' : '登录';
      }

      function loginRequest(name, pass, done) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', API_BASE + '/api/auth/login', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.timeout = 8000;
        xhr.onreadystatechange = function() {
          if (xhr.readyState !== 4) return;
          var data = safeParseJSON(xhr.responseText, null);
          done(null, {
            ok: xhr.status >= 200 && xhr.status < 300,
            status: xhr.status,
            data: data
          });
        };
        xhr.onerror = function() {
          done(new Error('network_error'));
        };
        xhr.ontimeout = function() {
          done(new Error('timeout'));
        };
        xhr.send(JSON.stringify({ name: name, password: pass }));
      }

      syncDocumentLang();

      var rememberedUser = safeParseJSON(localStorage.getItem('rememberedUser') || '{}', {});
      if (rememberedUser && rememberedUser.name) {
        if (nameInput) nameInput.value = rememberedUser.name;
        if (p) p.value = rememberedUser.password || '';
        if (def) def.checked = true;
      }

      if (form) {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          var name = String((nameInput && nameInput.value) || '').replace(/^\s+|\s+$/g, '');
          var pass = String((p && p.value) || '');
          if (!name) {
            showError('请输入登录名称');
            return;
          }
          hideError();
          setSubmitting(true);
          loginRequest(name, pass, function(requestError, response) {
            var authData = response && response.data ? response.data : null;
            if (requestError) {
              showError('连接服务器失败，请检查网络或证书设置');
              setSubmitting(false);
              return;
            }
            if (!response || !response.ok) {
              var rem = safeParseJSON(localStorage.getItem('rememberedUser') || '{}', {});
              if (rem && rem.name === name) {
                localStorage.removeItem('rememberedUser');
                if (def) def.checked = false;
              }
              if (response && response.status === 401) {
                showError('账号或密码错误（当前账号：' + name + '）');
              } else {
                showError('服务器返回错误（HTTP ' + ((response && response.status) || 0) + '）');
              }
              setSubmitting(false);
              return;
            }
            if (!authData || !authData.token || !authData.user) {
              showError('账号或密码错误（当前账号：' + name + '）');
              setSubmitting(false);
              return;
            }
            localStorage.setItem('authToken', authData.token);
            hideError();
            if (def && def.checked && name) {
              localStorage.setItem('rememberedUser', JSON.stringify({ name: name, password: pass }));
            } else {
              localStorage.removeItem('rememberedUser');
            }
            var locale = authData.user && authData.user.locale === 'es-ES' ? 'es-ES' : 'zh-CN';
            setAppLocale(locale);
            syncDocumentLang();
            setAuthUser({
              name: name,
              role: authData.user && authData.user.role ? authData.user.role : '',
              locale: locale
            });
            setSubmitting(false);
            location.href = './index.html#ledger';
          });
        });
      }

      if (nameInput) {
        nameInput.addEventListener('input', function() {
          hideError();
          if (!def || !def.checked) return;
          var remembered = safeParseJSON(localStorage.getItem('rememberedUser') || '{}', {});
          if (remembered && remembered.name && remembered.name !== String(nameInput.value || '').replace(/^\s+|\s+$/g, '')) {
            def.checked = false;
          }
        });
      }
      if (p) {
        p.addEventListener('input', function() {
          hideError();
        });
      }

      function showPassword() {
        if (p) p.type = 'text';
      }
      function hidePassword() {
        if (p) p.type = 'password';
      }
      if (eyeBtn) {
        eyeBtn.addEventListener('mousedown', showPassword);
        eyeBtn.addEventListener('mouseup', hidePassword);
        eyeBtn.addEventListener('mouseleave', hidePassword);
        eyeBtn.addEventListener('touchstart', showPassword, false);
        eyeBtn.addEventListener('touchend', hidePassword);
        eyeBtn.addEventListener('touchcancel', hidePassword);
      }
    </script>
  </body>
  </html>
